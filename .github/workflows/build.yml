name: Build (Windows 10 Mobile, ARM)

# Сборка разбита на этапы, у каждого свой кэш, который сохраняется ДАЖЕ ПРИ ПАДЕНИИ:
#   1. vcpkg (OpenSSL/zlib/gperf)  -> бинарный кэш vcpkg, собранные пакеты не пересобираются
#   2. исходники TDLib + генерация -> кэш по коммиту TDLib
#   3. сборка TDLib под ARM        -> кэш папки сборки, следующий прогон доcобирает с того же места
#   4. готовый TDLib               -> если есть, этапы 1-3 пропускаются целиком
#   5. само приложение (минуты)
# Если упало — жми "Re-run failed jobs" или пушь фикс: продолжит, а не начнёт заново.

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # TDLib 1.8.69. ARM32 из их build-скриптов убрали в 7cd545a, но сам код собирается — собираем руками.
  TD_COMMIT: 4c6377aa7386c39217878a9a56d581922ad37ca4
  # Последний коммит vcpkg, с которым TDLib официально собирался под arm-uwp
  VCPKG_COMMIT: bc3512a509f9d29b37346a7e7e929f9a26e66c7e
  # В SDK 10.0.26100 ARM32 больше нет — используем 22621
  WINSDK: 10.0.22621.0
  VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-bin,readwrite
  CACHE_VER: v3

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ---------- 4. готовый TDLib ----------
      - name: Restore finished TDLib
        id: tdcache
        uses: actions/cache/restore@v4
        with:
          path: tdlib
          key: tdlib-out-${{ env.CACHE_VER }}-${{ env.TD_COMMIT }}

      - name: Move Windows SDK 26100 away (no ARM32 there)
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # vcvars выбирает SDK по Include\<ver>\um\winsdkver.h и берёт Lib оттуда же — уносим только Include и Lib
          # (за пределы Windows Kits, на тот же диск). bin НЕ трогаем: упаковка appx грузит оттуда MrmSupport.dll.
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          New-Item -ItemType Directory -Force C:\sdk26100 | Out-Null
          foreach ($d in 'Include','Lib') {
            $p = Join-Path $kits "$d\10.0.26100.0"
            if (Test-Path $p) { Move-Item $p "C:\sdk26100\$d"; echo "moved $p" }
          }
          $armlib = "$kits\Lib\$env:WINSDK\um\arm\WindowsApp.lib"
          if (!(Test-Path $armlib)) { echo "::error::$armlib not found - ARM32 libs missing in SDK $env:WINSDK"; exit 1 }
          echo "OK: $armlib"

      # ---------- 1. vcpkg ----------
      - name: Restore vcpkg binary cache
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: D:\vcpkg-bin
          key: vcpkg-bin-${{ env.CACHE_VER }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/vcpkg-triplets/*') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-bin-${{ env.CACHE_VER }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/vcpkg-triplets/*') }}-

      - name: vcpkg install (openssl + zlib for arm-uwp, gperf)
        id: vcpkg
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\vcpkg-bin | Out-Null
          git clone -q https://github.com/microsoft/vcpkg.git D:\vcpkg
          cd D:\vcpkg
          git checkout -q $env:VCPKG_COMMIT
          .\bootstrap-vcpkg.bat -disableMetrics
          # pkg-config vcpkg нужен только чтобы проверить .pc-файлы, а msys2-пакет, который тянет этот коммит,
          # удалён с зеркал (404), choco-пакет тоже ненадёжен. Подставляем true.exe из Git for Windows — без сети.
          $env:PKG_CONFIG = "C:\Program Files\Git\usr\bin\true.exe"
          if (!(Test-Path $env:PKG_CONFIG)) { echo "::error::$env:PKG_CONFIG not found"; exit 1 }
          echo "PKG_CONFIG=$env:PKG_CONFIG"
          .\vcpkg.exe install gperf:x86-windows openssl:arm-uwp zlib:arm-uwp --overlay-triplets="$env:GITHUB_WORKSPACE\.github\vcpkg-triplets"
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem D:\vcpkg\buildtrees -Recurse -Filter *.log | Sort-Object LastWriteTime | Select-Object -Last 3 | ForEach-Object { echo "==== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
            exit 1
          }

      - name: Save vcpkg binary cache (even on failure)
        if: always() && steps.tdcache.outputs.cache-hit != 'true' && steps.vcpkg.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: D:\vcpkg-bin
          key: vcpkg-bin-${{ env.CACHE_VER }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/vcpkg-triplets/*') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ---------- 2. исходники TDLib + генерация ----------
      - name: Restore TDLib sources
        id: tdsrc
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: D:\td
          key: td-src-${{ env.CACHE_VER }}-${{ env.TD_COMMIT }}

      - name: Checkout TDLib and generate sources
        id: tdgen
        if: steps.tdcache.outputs.cache-hit != 'true' && steps.tdsrc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git init -q D:\td
          cd D:\td
          git remote add origin https://github.com/tdlib/td.git
          git fetch -q --depth 1 origin $env:TD_COMMIT
          git checkout -q FETCH_HEAD

          $env:PATH = "D:\vcpkg\installed\x86-windows\tools\gperf;$env:PATH"
          New-Item -ItemType Directory -Force D:\td-gen | Out-Null
          cd D:\td-gen
          cmake -A Win32 -DTD_GENERATE_SOURCE_FILES=ON -DTD_ENABLE_DOTNET=CX D:\td
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build . --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Save TDLib sources
        if: steps.tdgen.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: D:\td
          key: td-src-${{ env.CACHE_VER }}-${{ env.TD_COMMIT }}

      # ---------- 3. сборка TDLib под ARM (инкрементально) ----------
      - name: Restore TDLib ARM build dir
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: D:\td-arm
          key: td-arm-${{ env.CACHE_VER }}-${{ env.TD_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            td-arm-${{ env.CACHE_VER }}-${{ env.TD_COMMIT }}-

      - name: Build TDLib (UWP ARM, Release)
        id: tdbuild
        if: steps.tdcache.outputs.cache-hit != 'true'
        # оставляем запас времени, чтобы успеть сохранить недособранное в кэш
        timeout-minutes: 270
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\td-arm | Out-Null
          cd D:\td-arm
          if (!(Test-Path CMakeCache.txt)) {
            cmake -A ARM -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION="$env:WINSDK" `
              -DCMAKE_TOOLCHAIN_FILE=D:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=arm-uwp `
              -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\.github\vcpkg-triplets" `
              -DTD_ENABLE_PCH:BOOL=ON -DTD_ENABLE_DOTNET=CX D:\td
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            echo "Продолжаем сборку из кэша"
          }
          cmake --build . --config Release --target tddotnet --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $out = "$env:GITHUB_WORKSPACE\tdlib\ARM"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item Release\* -Include "libcrypto*.dll","libssl*.dll","zlib*.dll","Telegram.Td.dll","Telegram.Td.winmd","Telegram.Td.pri" -Destination $out
          Get-ChildItem $out | Select-Object Name, Length
          if (!(Test-Path "$out\Telegram.Td.winmd")) { echo "::error::Telegram.Td.winmd not produced"; exit 1 }

      - name: Save TDLib ARM build dir (even on failure/timeout)
        if: always() && steps.tdcache.outputs.cache-hit != 'true' && steps.tdbuild.outcome != 'success' && steps.tdbuild.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: D:\td-arm
          key: td-arm-${{ env.CACHE_VER }}-${{ env.TD_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save finished TDLib
        if: steps.tdbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: tdlib
          key: tdlib-out-${{ env.CACHE_VER }}-${{ env.TD_COMMIT }}

      - name: Upload TDLib
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-arm-uwp
          path: tdlib

      # ---------- 5. приложение ----------
      - uses: microsoft/setup-msbuild@v2

      - name: Signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\pagegram.pfx"
          if ($env:SIGNING_PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $pw = $env:SIGNING_PFX_PASSWORD
          } else {
            # Временный сертификат. Каждый прогон — новый, поэтому обновление поверх
            # потребует удалить старую версию. Положи свой PFX в секреты, чтобы этого не было.
            $pw = [guid]::NewGuid().ToString()
            $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Pagegram" -KeyUsage DigitalSignature `
              -FriendlyName "Pagegram" -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          }
          echo "::add-mask::$pw"
          echo "PFX_PATH=$pfx" >> $env:GITHUB_ENV
          echo "PFX_PASSWORD=$pw" >> $env:GITHUB_ENV

      - name: Build app (Release | ARM, .NET Native)
        shell: pwsh
        run: |
          msbuild Pagegram.sln /restore /m /v:minimal `
            /p:Configuration=Release /p:Platform=ARM `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:PFX_PATH" `
            /p:PackageCertificatePassword="$env:PFX_PASSWORD"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out -Recurse | Select-Object FullName, Length

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Pagegram-ARM
          path: |
            out/**/*.appx
            out/**/*.cer
            out/**/Dependencies/ARM/*.appx
